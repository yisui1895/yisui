<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学成在线</title>
    <!-- ！顺序要求：先清除再设置 -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <!-- 头部区域-->
    <div class="header">
        <!-- 通栏容器 -->
        <div class="wrapper">
            <!-- 网站logo -->
            <div class="logo">
                <h1>
                    <a href="#">天高云阔</a>
                </h1>
            </div>
            <!-- 顶部导航栏 -->
            <div class="nav">
                <ul>
                    <li><a href="#" class="active">首页</a></li>
                    <li><a href="#">课程</a></li>
                    <li><a href="#">职业规划</a></li>
                </ul>
            </div>
            <!-- 搜索 -->
            <div class="search">
                <input type="text" placeholder="请输入关键字">
                <a href="#"></a>
            </div>
            <!-- 用户 -->
            <div class="user">
                <a href="#">
                <div class="avatar"> <!-- 这个盒子老师没用 -->
                <img src="./uploads/user.png" alt="">
                </div> <!--（头像框固定尺寸）-->
                <span>牟百合</span>
                </a>
            </div>
        </div>
    </div>

    <!-- banner区域 -->
     <div class="banner">
        <div class="wrapper">
            <div class="left">左</div>
            <div class="right">右</div>
        </div>
     </div>
